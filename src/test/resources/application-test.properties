# Exclusivo de pruebas: nunca conecta a MySQL ni necesita credenciales reales.
spring.datasource.url=jdbc:h2:mem:safework_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.jpa.open-in-view=false
safework.archivos.migracion-habilitada=false
safework.plataforma.bootstrap-habilitado=false
