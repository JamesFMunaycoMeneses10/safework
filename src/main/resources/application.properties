spring.application.name=safework
spring.datasource.url=${SAFEWORK_DB_URL:jdbc:mysql://localhost:3306/safework_db}
spring.datasource.username=${SAFEWORK_DB_USER}
spring.datasource.password=${SAFEWORK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=${SAFEWORK_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
# Solo habilitar una vez sobre una BD existente cuyo esquema y respaldo se verificaron.
safework.migrar-adjuntos-antiguos=false
safework.plataforma.crear-administrador=${SAFEWORK_CREAR_ADMIN_PLATAFORMA:false}

# Carpeta usada solo para importar adjuntos antiguos al iniciar; las nuevas subidas van a MySQL.
safework.archivos.directorio=${SAFEWORK_UPLOAD_DIR:${user.home}/safework-uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
