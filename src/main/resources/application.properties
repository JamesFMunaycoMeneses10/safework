spring.application.name=safework
spring.datasource.url=${SAFEWORK_DB_URL:jdbc:mysql://localhost:3306/safework_db}
spring.datasource.username=${SAFEWORK_DB_USER}
spring.datasource.password=${SAFEWORK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=${SAFEWORK_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
# Solo habilitar una vez sobre una BD existente cuyo esquema y respaldo se verificaron.
safework.migrar-adjuntos-antiguos=false
safework.plataforma.crear-administrador=${SAFEWORK_CREAR_ADMIN_PLATAFORMA:false}

# Carpeta usada solo para importar adjuntos antiguos al iniciar; las nuevas subidas van a MySQL.
safework.archivos.directorio=${SAFEWORK_UPLOAD_DIR:${user.home}/safework-uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Recuperación deshabilitada hasta disponer de SMTP y HTTPS reales.
safework.recuperacion.enabled=${SAFEWORK_RECUPERACION_ENABLED:false}
safework.public-url=${SAFEWORK_PUBLIC_URL:}
safework.mail.from=${SAFEWORK_MAIL_FROM:}
spring.mail.host=${SAFEWORK_SMTP_HOST:}
spring.mail.port=${SAFEWORK_SMTP_PORT:587}
spring.mail.username=${SAFEWORK_SMTP_USERNAME:}
spring.mail.password=${SAFEWORK_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# El correo opcional no determina la disponibilidad del servicio SST.
management.health.mail.enabled=false

# Integración académica: no existe modo de cobro real en esta versión.
safework.pagos.enabled=${SAFEWORK_PAGOS_ENABLED:false}
safework.pagos.access-token=${SAFEWORK_MP_TEST_ACCESS_TOKEN:}
safework.pagos.vendedor-id=${SAFEWORK_MP_TEST_SELLER_ID:0}
# ID copiado desde la cuenta COMPRADOR de prueba del panel; 0 mantiene el rechazo de live_mode=true.
safework.pagos.comprador-id=${SAFEWORK_MP_TEST_BUYER_ID:0}
safework.pagos.webhook-secret=${SAFEWORK_MP_WEBHOOK_SECRET:}
