<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
        Fragmento reutilizable de navegación.

        th:fragment="navbar"
        permite insertar esta barra en otras
        páginas HTML de SafeWork.
    -->
    <nav
      class="navbar navbar-expand-lg bg-dark navbar-dark"
      th:fragment="navbar"
    >
      <div class="container">
        <!--
                Nombre principal del sistema.

                Por ahora dirige al módulo de áreas.
                Más adelante podremos crear una página
                de inicio general para SafeWork.
            -->
        <a class="navbar-brand fw-bold" th:href="@{/areas}"> SafeWork </a>

        <!-- Navegación principal -->
        <div class="navbar-nav">
          <!-- ====================== -->
          <!-- MÓDULO ÁREAS -->
          <!-- ====================== -->

          <a class="nav-link" th:href="@{/areas}"> Áreas </a>

          <!-- ====================== -->
          <!-- MÓDULO TRABAJADORES -->
          <!-- ====================== -->

          <a class="nav-link" th:href="@{/trabajadores}"> Trabajadores </a>

          <!-- ====================== -->
          <!-- MÓDULO RIESGOS -->
          <!-- ====================== -->

          <!--
                    Este módulo ya está disponible,
                    por eso ahora utilizamos un enlace.
                -->
          <a class="nav-link" th:href="@{/riesgos}"> Riesgos </a>

          <!-- ====================== -->
          <!-- MÓDULOS FUTUROS -->
          <!-- ====================== -->

          <!--
                    Inspecciones todavía no está desarrollado,
                    por eso permanece deshabilitado.
                -->
          <a class="nav-link" th:href="@{/inspecciones}"> Inspecciones </a>
        </div>
      </div>
    </nav>
  </body>
</html>
