<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitaciones - SafeWork</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/internal-layout.css}">
</head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 th:text="${capacitacion.tema}"></h1><p class="text-secondary mb-0" th:text="${capacitacion.objetivo}"></p></div><a th:href="@{/capacitaciones}" class="btn btn-outline-secondary">Volver</a></div>
<div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<div class="card shadow-sm mb-4"><div class="card-body"><dl class="row mb-0"><dt class="col-sm-3">Fecha y hora</dt><dd class="col-sm-9" th:text="${#temporals.format(capacitacion.fechaHora,'dd/MM/yyyy HH:mm')}"></dd><dt class="col-sm-3">Duración</dt><dd class="col-sm-9" th:text="${capacitacion.duracionMinutos + ' minutos'}"></dd><dt class="col-sm-3">Área</dt><dd class="col-sm-9" th:text="${capacitacion.area.nombre}"></dd><dt class="col-sm-3">Instructor</dt><dd class="col-sm-9" th:text="${capacitacion.instructor}"></dd><dt class="col-sm-3">Estado</dt><dd class="col-sm-9" th:text="${capacitacion.estado}"></dd></dl></div></div>
<div class="card shadow-sm"><div class="card-body"><h2 class="h4">Participantes y asistencia</h2><p class="text-secondary">Registra asistencia cuando haya comenzado la actividad. Finaliza cuando termine el horario y todos tengan asistencia marcada.</p>
<form th:action="@{/capacitaciones/{id}/asistencia(id=${capacitacion.id})}" method="post"><div class="table-responsive"><table class="table align-middle"><thead class="table-light"><tr><th>Trabajador</th><th>Asistencia</th></tr></thead><tbody><tr th:each="p:${participantes}"><td th:text="${p.trabajador.nombres + ' ' + p.trabajador.apellidos}"></td><td><input type="hidden" name="participanteIds" th:value="${p.id}"><select th:if="${capacitacion.estado == 'PROGRAMADA'}" name="estados" class="form-select" required><option value="" th:selected="${p.asistencia == 'PENDIENTE'}">Seleccione</option><option value="ASISTIO" th:selected="${p.asistencia == 'ASISTIO'}">Asistió</option><option value="FALTO" th:selected="${p.asistencia == 'FALTO'}">Faltó</option></select><span th:unless="${capacitacion.estado == 'PROGRAMADA'}" th:text="${p.asistencia}"></span></td></tr></tbody></table></div><button th:if="${capacitacion.estado == 'PROGRAMADA'}" class="btn btn-primary">Guardar asistencia</button></form>
<div class="d-flex flex-wrap gap-2 border-top pt-3 mt-3" th:if="${capacitacion.estado == 'PROGRAMADA'}"><a class="btn btn-outline-primary" th:href="@{/capacitaciones/{id}/editar(id=${capacitacion.id})}">Editar programación</a><form method="post" th:action="@{/capacitaciones/{id}/finalizar(id=${capacitacion.id})}"><button class="btn btn-success">Finalizar capacitación</button></form><form method="post" th:action="@{/capacitaciones/{id}/cancelar(id=${capacitacion.id})}" onsubmit="return confirm('¿Cancelar esta capacitación? Se conservará su historial.');"><button class="btn btn-outline-danger">Cancelar capacitación</button></form></div></div></div>
</main></body></html>
