<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitaciones - SafeWork</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/internal-layout.css}">
</head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
<div><h1>Capacitaciones</h1><p class="text-secondary mb-0">Programa formación en SST y consulta la asistencia de los trabajadores.</p></div>
<a class="btn btn-primary" th:href="@{/capacitaciones/nueva}">+ Programar capacitación</a></div>
<form th:action="@{/capacitaciones}" method="get" class="row g-2 align-items-end mb-4">
<div class="col-lg-4"><label for="q" class="form-label">Tema o instructor</label><input class="form-control" id="q" name="q" maxlength="150" th:value="${q}"></div>
<div class="col-lg-3"><label for="area" class="form-label">Área</label><select class="form-select" name="area" id="area"><option value="">Todas las áreas</option><option th:each="a:${areas}" th:value="${a.id}" th:text="${a.nombre}" th:selected="${area == a.id}"></option></select></div>
<div class="col-lg-2"><label for="estado" class="form-label">Estado</label><select class="form-select" name="estado" id="estado"><option value="">Todos</option><option th:each="e:${estadosCapacitacion}" th:value="${e}" th:text="${e}" th:selected="${estado == e}"></option></select></div>
<div class="col-lg-3 d-flex gap-2"><button class="btn btn-primary">Filtrar</button><a th:href="@{/capacitaciones}" class="btn btn-outline-secondary">Limpiar</a></div></form>
<div class="card shadow-sm"><div class="card-body"><div class="table-responsive"><table class="table align-middle table-hover mb-0">
<thead class="table-light"><tr><th>Tema</th><th>Fecha y hora</th><th>Área</th><th>Instructor</th><th>Estado</th><th>Seguimiento</th></tr></thead><tbody>
<tr th:each="c:${resultado.content}"><td th:text="${c.tema}"></td><td th:text="${#temporals.format(c.fechaHora,'dd/MM/yyyy HH:mm')}"></td><td th:text="${c.area.nombre}"></td><td th:text="${c.instructor}"></td><td><span class="badge" th:classappend="${c.estado == 'REALIZADA' ? 'text-bg-success' : (c.estado == 'CANCELADA' ? 'text-bg-secondary' : 'text-bg-primary')}" th:text="${c.estado}"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/capacitaciones/{id}(id=${c.id})}">Ver participantes</a></td></tr>
<tr th:if="${resultado.empty}"><td colspan="6" class="text-center text-secondary py-4">No hay capacitaciones con estos filtros.</td></tr></tbody></table></div></div></div>
<nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Paginación"><span th:text="${resultado.totalElements + ' capacitaciones'}"></span><div class="d-flex gap-2"><a th:if="${resultado.hasPrevious()}" class="btn btn-outline-secondary btn-sm" th:href="@{/capacitaciones(q=${q},estado=${estado},area=${area},pagina=${resultado.number - 1})}">Anterior</a><a th:if="${resultado.hasNext()}" class="btn btn-outline-secondary btn-sm" th:href="@{/capacitaciones(q=${q},estado=${estado},area=${area},pagina=${resultado.number + 1})}">Siguiente</a></div></nav>
</main></body></html>
