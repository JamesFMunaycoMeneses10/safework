<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Inspecciones - SafeWork</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- Barra de navegación -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <div class="container py-5">


        <!-- ============================== -->
        <!-- ENCABEZADO -->
        <!-- ============================== -->

        <div
            class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">
                    Gestión de Inspecciones
                </h1>

                <p class="text-muted mb-0">
                    Registro y seguimiento de inspecciones de seguridad
                </p>

            </div>


            <!-- Nueva inspección -->
            <a
                th:if="${puedeGestionarSst}"
                th:href="@{/inspecciones/nueva}"
                class="btn btn-primary">

                + Nueva Inspección

            </a>

        </div>


        <!-- ============================== -->
        <!-- TABLA -->
        <!-- ============================== -->

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle mb-0">


                        <thead>

                            <tr>

                                <th>
                                    Fecha
                                </th>

                                <th>
                                    Tipo
                                </th>

                                <th>
                                    Área
                                </th>

                                <th>
                                    Responsable
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Observaciones
                                </th>

                                <th th:if="${puedeGestionarSst}" class="text-end">
                                    Acciones
                                </th>

                            </tr>

                        </thead>


                        <tbody>


                            <!--
                                Recorremos las inspecciones
                                enviadas por InspeccionController.
                            -->
                            <tr th:each="inspeccion : ${inspecciones}">


                                <!-- Fecha -->
                                <td
                                    th:text="${#temporals.format(
                                        inspeccion.fecha,
                                        'dd/MM/yyyy'
                                    )}">
                                </td>


                                <!-- Tipo -->
                                <td th:text="${inspeccion.tipo}">
                                </td>


                                <!-- Área -->
                                <td th:text="${inspeccion.area.nombre}">
                                </td>


                                <!-- Responsable -->
                                <td>

                                    <span
                                        th:text="${inspeccion.responsable.nombres
                                            + ' '
                                            + inspeccion.responsable.apellidos}">
                                    </span>

                                </td>


                                <!-- ============================== -->
                                <!-- ESTADO -->
                                <!-- ============================== -->

                                <td>


                                    <!-- Programada -->
                                    <span
                                        th:if="${inspeccion.estado == 'Programada'}"
                                        class="badge text-bg-warning">

                                        Programada

                                    </span>


                                    <!-- Realizada -->
                                    <span
                                        th:if="${inspeccion.estado == 'Realizada'}"
                                        class="badge text-bg-primary">

                                        Realizada

                                    </span>


                                    <!-- Cerrada -->
                                    <span
                                        th:if="${inspeccion.estado == 'Cerrada'}"
                                        class="badge text-bg-success">

                                        Cerrada

                                    </span>


                                </td>


                                <!-- Observaciones -->
                                <td th:text="${inspeccion.observaciones}">
                                </td>


                                <!-- ============================== -->
                                <!-- ACCIONES -->
                                <!-- ============================== -->

                                <td th:if="${puedeGestionarSst}" class="text-end">


                                    <!-- Editar -->
                                    <a
                                        th:href="@{/inspecciones/editar/{id}(id=${inspeccion.id})}"
                                        class="btn btn-sm btn-outline-primary">

                                        Editar

                                    </a>


                                    <!-- Eliminar -->
                                    <form
                                        th:action="@{/inspecciones/eliminar/{id}(id=${inspeccion.id})}"
                                        method="post"
                                        class="d-inline"
                                        onsubmit="return confirm('¿Está seguro de eliminar esta inspección?');">


                                        <button
                                            type="submit"
                                            class="btn btn-sm btn-outline-danger">

                                            Eliminar

                                        </button>


                                    </form>


                                </td>


                            </tr>


                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </div>


</body>

</html>
