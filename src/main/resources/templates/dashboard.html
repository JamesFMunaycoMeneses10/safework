<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard SafeWork</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- Navbar -->

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
      <h1 class="fw-bold mb-4">Dashboard SafeWork</h1>

      <p class="text-muted">
        Resumen general de Seguridad y Salud en el Trabajo.
      </p>

      <div class="row g-4 mt-3">
        <!-- Trabajadores -->

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5>Trabajadores</h5>

              <h1 class="fw-bold" th:text="${totalTrabajadores}">0</h1>
            </div>
          </div>
        </div>

        <!-- Riesgos -->

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5>Riesgos</h5>

              <h1 class="fw-bold" th:text="${totalRiesgos}">0</h1>
            </div>
          </div>
        </div>

        <!-- Incidentes -->

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5>Incidentes</h5>

              <h1 class="fw-bold" th:text="${totalIncidentes}">0</h1>
            </div>
          </div>
        </div>

        <!-- Acciones -->

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5>Acciones Correctivas</h5>

              <h1 class="fw-bold" th:text="${totalAcciones}">0</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mt-5">
        <div class="card-body">
          <h4>Estado del sistema</h4>

          <p class="text-muted">
            SafeWork cuenta actualmente con módulos activos de gestión SST.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
