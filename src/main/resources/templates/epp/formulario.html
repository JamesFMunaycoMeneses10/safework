<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar entrega de EPP - SafeWork</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/forms.css}" />
  <link rel="stylesheet" th:href="@{/css/internal-layout.css}" />
</head>
<body class="bg-light sw-form-page">
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <main class="container py-5 sw-form-container">
    <h1 class="mb-1">Registrar entrega de EPP</h1>
    <p class="text-secondary mb-4">Deja constancia del equipo de protección entregado a un trabajador.</p>
    <div class="card shadow-sm"><div class="card-body">
      <form th:action="@{/epp/guardar}" th:object="${entrega}" method="post">
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div class="mb-3">
          <label for="trabajadorId" class="form-label">Trabajador</label>
          <select id="trabajadorId" class="form-select" th:field="*{trabajadorId}" required>
            <option value="">Seleccione un trabajador</option>
            <option th:each="trabajador : ${trabajadores}" th:value="${trabajador.id}" th:text="${trabajador.nombres + ' ' + trabajador.apellidos + ' · ' + trabajador.dni}"></option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('trabajadorId')}" th:errors="*{trabajadorId}"></div>
        </div>
        <div class="mb-3">
          <label for="tipoEpp" class="form-label">Tipo de EPP</label>
          <input id="tipoEpp" type="text" class="form-control" th:field="*{tipoEpp}" maxlength="100" placeholder="Ejemplo: casco de seguridad" required />
          <div class="text-danger small" th:if="${#fields.hasErrors('tipoEpp')}" th:errors="*{tipoEpp}"></div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
            <input id="fechaEntrega" type="date" class="form-control" th:field="*{fechaEntrega}" required />
            <div class="text-danger small" th:if="${#fields.hasErrors('fechaEntrega')}" th:errors="*{fechaEntrega}"></div>
          </div>
          <div class="col-md-6">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input id="cantidad" type="number" min="1" max="1000" class="form-control" th:field="*{cantidad}" required />
            <div class="text-danger small" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
          </div>
        </div>
        <div class="mb-3">
          <label for="observaciones" class="form-label">Observaciones <span class="text-secondary">(opcional)</span></label>
          <textarea id="observaciones" class="form-control" th:field="*{observaciones}" maxlength="500" rows="3" placeholder="Talla, estado u otra información útil"></textarea>
          <div class="text-danger small" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}"></div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar entrega</button>
          <a th:href="@{/epp}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div></div>
  </main>
</body>
</html>
