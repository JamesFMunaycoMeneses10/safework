<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Trabajador - SafeWork</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/internal-layout.css}" />
  </head>

  <body class="bg-light sw-form-page">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 sw-form-container">
      <!--
            El título cambia dependiendo
            de si registramos o editamos.
        -->
      <h1
        class="mb-1"
        th:text="${trabajador.id == null
                ? 'Registrar Nuevo Trabajador'
                : 'Editar Trabajador'}"
      >
        Trabajador
      </h1>

      <p class="text-secondary mb-4">Ingresa la información del trabajador.</p>

      <div class="card shadow-sm">
        <div class="card-body">
          <form class="sw-editor-form"
            th:action="@{/trabajadores/guardar}"
            th:object="${trabajador}"
            method="post"
          >
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
            <!-- Alerta general -->
            <div
              class="alert alert-danger"
              role="alert"
              th:if="${#fields.hasAnyErrors()}"
            >
              <strong> Hay errores en el formulario. </strong>

              Por favor, corrige los datos antes de continuar.
            </div>

            <!-- ID oculto -->
            <input type="hidden" th:field="*{id}" />

            <!-- DNI -->
            <div class="mb-3">
              <label for="dni" class="form-label"> DNI </label>

              <input
                type="text"
                id="dni"
                class="form-control"
                th:field="*{dni}"
                maxlength="8"
                placeholder="Ejemplo: 12345678"
              />

              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('dni')}"
                th:errors="*{dni}"
              ></div>
            </div>

            <!-- Nombres -->
            <div class="mb-3">
              <label for="nombres" class="form-label"> Nombres </label>

              <input
                type="text"
                id="nombres"
                class="form-control"
                th:field="*{nombres}"
                placeholder="Ejemplo: Juan Carlos"
              />

              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('nombres')}"
                th:errors="*{nombres}"
              ></div>
            </div>

            <!-- Apellidos -->
            <div class="mb-3">
              <label for="apellidos" class="form-label"> Apellidos </label>

              <input
                type="text"
                id="apellidos"
                class="form-control"
                th:field="*{apellidos}"
                placeholder="Ejemplo: Pérez López"
              />

              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('apellidos')}"
                th:errors="*{apellidos}"
              ></div>
            </div>

            <!-- Cargo -->
            <div class="mb-3">
              <label for="cargo" class="form-label"> Cargo </label>

              <input
                type="text"
                id="cargo"
                class="form-control"
                th:field="*{cargo}"
                placeholder="Ejemplo: Operario"
              />

              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('cargo')}"
                th:errors="*{cargo}"
              ></div>
            </div>

            <!-- ========================== -->
            <!-- ÁREA -->
            <!-- ========================== -->

            <div class="mb-4">
              <label for="area" class="form-label"> Área </label>

              <!--
                            Selector de áreas.

                            th:field="*{area}"
                            relaciona la selección con
                            el atributo area de Trabajador.
                        -->
              <select id="area" class="form-select" th:field="*{area}">
                <!-- Opción inicial -->
                <option value="">Seleccione un área</option>

                <!--
                                Recorremos la lista "areas"
                                enviada desde el Controller.
                            -->
                <option
                  th:each="area : ${areas}"
                  th:value="${area.id}"
                  th:text="${area.nombre}"
                ></option>
              </select>

              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('area')}"
                th:errors="*{area}"
              ></div>
            </div>

            <div class="mb-4">
              <label for="usuario" class="form-label">Cuenta de acceso del trabajador</label>
              <select id="usuario" class="form-select" th:field="*{usuario}">
                <option value="">Sin cuenta vinculada</option>
                <option th:each="usuario : ${usuarios}" th:if="${usuario.estado == 'ACTIVO'}"
                        th:value="${usuario.id}"
                        th:text="${usuario.nombre + ' ' + usuario.apellido + ' (' + usuario.username + ')'}"></option>
              </select>
              <small class="form-text">Vincula una cuenta única para que solo esta persona pueda entregar sus evidencias.</small>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Guardar</button>

              <a th:href="@{/trabajadores}" class="btn btn-outline-secondary">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
