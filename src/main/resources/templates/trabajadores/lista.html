<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Trabajadores - SafeWork</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- Barra de navegación reutilizable -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
      <!-- Encabezado -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="mb-1">Gestión de Trabajadores</h1>

          <p class="text-secondary mb-0">
            Administra los trabajadores registrados en SafeWork.
          </p>
        </div>

        <!-- Ir al formulario -->
        <a th:href="@{/trabajadores/nuevo}" class="btn btn-primary">
          + Nuevo Trabajador
        </a>
      </div>

      <!-- Tarjeta -->
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                
                  <th>DNI</th>

                  <th>Nombres</th>

                  <th>Apellidos</th>

                  <th>Cargo</th>

                  <th>Área</th>

                  <th class="text-end">Acciones</th>
                </tr>
              </thead>

              <tbody>
                <!--
                                Recorremos la lista "trabajadores"
                                enviada desde TrabajadorController.
                            -->
                <tr th:each="trabajador : ${trabajadores}">
                
                  <td th:text="${trabajador.dni}"></td>

                  <td th:text="${trabajador.nombres}"></td>

                  <td th:text="${trabajador.apellidos}"></td>

                  <td th:text="${trabajador.cargo}"></td>

                  <!--
                                    Aquí accedemos al nombre
                                    del área relacionada.
                                -->
                  <td th:text="${trabajador.area.nombre}"></td>

                  <!-- Acciones -->
                  <td class="text-end">
                    <!-- Editar -->
                    <a
                      th:href="@{/trabajadores/editar/{id}(id=${trabajador.id})}"
                      class="btn btn-sm btn-outline-primary"
                    >
                      Editar
                    </a>

                    <!-- Eliminar -->
                    <form
                      th:action="@{/trabajadores/eliminar/{id}(id=${trabajador.id})}"
                      method="post"
                      class="d-inline"
                      onsubmit="
                        return confirm(
                          '¿Está seguro de eliminar este trabajador?',
                        );
                      "
                    >
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                      >
                        Eliminar
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
