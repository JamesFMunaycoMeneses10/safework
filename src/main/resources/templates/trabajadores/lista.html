<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Trabajadores - SafeWork</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/internal-layout.css}" />
</head>


<body class="bg-light">


<!-- Navbar -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<div class="container py-5">


    <!-- Encabezado -->

    <div class="d-flex justify-content-between align-items-center mb-4">


        <div>

            <h1 class="mb-1">
                Gestión de Trabajadores
            </h1>

            <p class="text-secondary mb-0">
                Administra los trabajadores registrados en SafeWork.
            </p>

        </div>



        <a 
            th:if="${puedeGestionarSst}"
            th:href="@{/trabajadores/nuevo}"
            class="btn btn-primary">

            + Nuevo Trabajador

        </a>


    </div>




    <!-- MENSAJE ERROR -->

    <div 
        class="alert alert-danger"
        th:if="${error}"
        th:text="${error}">
    </div>



    <!-- MENSAJE ÉXITO -->

    <div 
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}">
    </div>




    <form method="get" th:action="@{/trabajadores}" class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="filtroArea" class="form-label">Área</label>
                    <select id="filtroArea" name="areaId" class="form-select">
                        <option value="">Todas las áreas</option>
                        <option th:each="area : ${areas}" th:value="${area.id}"
                                th:text="${area.nombre}"
                                th:selected="${areaIdSeleccionada != null and areaIdSeleccionada == area.id}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label for="filtroDni" class="form-label">DNI</label>
                    <input id="filtroDni" name="dni" type="search" inputmode="numeric"
                           maxlength="8" class="form-control" placeholder="DNI completo o parcial"
                           th:value="${dniFiltro}" />
                </div>
                <div class="col-12 col-md-3">
                    <label for="filtroCargo" class="form-label">Cargo</label>
                    <select id="filtroCargo" name="cargo" class="form-select">
                        <option value="">Todos los cargos</option>
                        <option th:each="cargoOpcion : ${cargos}" th:value="${cargoOpcion}"
                                th:text="${cargoOpcion}"
                                th:selected="${cargoSeleccionado == cargoOpcion}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a th:href="@{/trabajadores}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </div>
        </div>
    </form>

    <!-- TABLA TRABAJADORES -->


    <div class="card shadow-sm">


        <div class="card-body">


            <div class="table-responsive">


                <table class="table table-hover align-middle">


                    <thead class="table-light">


                        <tr>

                            <th>DNI</th>

                            <th>Nombres</th>

                            <th>Apellidos</th>

                            <th>Cargo</th>

                            <th>Área</th>

                            <th th:if="${puedeGestionarSst}" class="text-end">
                                Acciones
                            </th>


                        </tr>


                    </thead>



                    <tbody>

                        <tr th:if="${#lists.isEmpty(trabajadores)}">
                            <td th:colspan="${puedeGestionarSst ? 6 : 5}"
                                class="text-center text-secondary py-4">
                                No se encontraron trabajadores con esos filtros.
                            </td>
                        </tr>



                        <tr th:each="trabajador : ${trabajadores}">


                            <td th:text="${trabajador.dni}">
                            </td>



                            <td th:text="${trabajador.nombres}">
                            </td>



                            <td th:text="${trabajador.apellidos}">
                            </td>



                            <td th:text="${trabajador.cargo}">
                            </td>



                            <td th:text="${trabajador.area.nombre}">
                            </td>



                            <td th:if="${puedeGestionarSst}" class="text-end">


                                <!-- EDITAR -->

                                <a

                                    th:href="@{/trabajadores/editar/{id}(id=${trabajador.id})}"

                                    class="btn btn-sm btn-outline-primary">

                                    Editar

                                </a>




                                <!-- ELIMINAR -->


                                <form

                                    th:action="@{/trabajadores/eliminar/{id}(id=${trabajador.id})}"

                                    method="post"

                                    class="d-inline"

                                    onsubmit="return confirm('¿Está seguro de eliminar este trabajador?');">


                                    <button

                                        type="submit"

                                        class="btn btn-sm btn-outline-danger">

                                        Eliminar

                                    </button>


                                </form>



                            </td>


                        </tr>



                    </tbody>


                </table>


            </div>


        </div>


    </div>



</div>


</body>

</html>
