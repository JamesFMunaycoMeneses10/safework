<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="login-body"><main class="login-container"><h1 class="login-title">SafeWork</h1><h2 class="h4">Nueva contraseña</h2><div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div><div th:unless="${valido}" class="alert alert-warning">El enlace no es válido o ya venció. Solicita uno nuevo.</div><form th:if="${valido}" th:action="@{/restablecer}" method="post"><input type="hidden" name="token" th:value="${token}"><label for="password" class="login-label">Contraseña nueva</label><input id="password" name="password" type="password" class="login-input mb-3" minlength="12" maxlength="72" autocomplete="new-password" required><label for="confirmacion" class="login-label">Repite la contraseña</label><input id="confirmacion" name="confirmacion" type="password" class="login-input mb-3" minlength="12" maxlength="72" autocomplete="new-password" required><p>Mínimo 12 caracteres y máximo 72 bytes UTF-8.</p><button class="login-button">Actualizar contraseña</button></form><p class="mt-3"><a th:href="@{/login}">Volver al inicio de sesión</a></p></main></body></html>
