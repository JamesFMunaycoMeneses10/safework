<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="login-body"><main class="login-container"><h1 class="login-title">SafeWork</h1><h2 class="h4">Recuperar acceso</h2><p>Usaremos únicamente el correo que ya está registrado en tu cuenta.</p><div th:if="${success}" class="alert alert-info" role="status" th:text="${success}"></div><div th:unless="${disponible}" class="alert alert-info">El envío de correos todavía no está habilitado. Solicita ayuda al administrador de tu empresa.</div><form th:if="${disponible}" th:action="@{/recuperar}" method="post"><label for="username" class="login-label">Usuario</label><input id="username" name="username" maxlength="100" class="login-input mb-3" required autocomplete="username"><button class="login-button">Solicitar enlace</button></form><p class="mt-3"><a th:href="@{/login}">Volver al inicio de sesión</a></p></main></body></html>
