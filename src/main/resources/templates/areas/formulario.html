<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Área - SafeWork</title>

    <!--
        Bootstrap.

        Permite utilizar estilos ya preparados
        para formularios, botones, alertas,
        tarjetas, espacios, etc.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <!-- Contenedor principal -->
    <div class="container py-5">
      <!--
            El título cambia automáticamente.

            Si area.id es null:
            Registrar Nueva Área

            Si area.id contiene un valor:
            Editar Área
        -->
      <h1
        class="mb-1"
        th:text="${area.id == null ? 'Registrar Nueva Área' : 'Editar Área'}"
      >
        Área
      </h1>

      <!-- Subtítulo -->
      <p class="text-secondary mb-4">
        Ingresa la información del área de trabajo.
      </p>

      <!-- Tarjeta que contiene el formulario -->
      <div class="card shadow-sm">
        <div class="card-body">
          <!--
                    Formulario utilizado tanto
                    para registrar como para editar.

                    th:action:
                    define la ruta que recibirá los datos.

                    th:object:
                    relaciona el formulario con
                    el objeto Area.

                    method="post":
                    envía los datos mediante POST.
                -->
          <form th:action="@{/areas/guardar}" th:object="${area}" method="post">
            <!--
                        Alerta general de validación.

                        IMPORTANTE:
                        Está dentro del formulario porque
                        utiliza #fields, y #fields necesita
                        el contexto definido por th:object.

                        Solo aparece cuando existe al menos
                        un error de validación.
                    -->
            <div
              class="alert alert-danger"
              role="alert"
              th:if="${#fields.hasAnyErrors()}"
            >
              <strong> Hay errores en el formulario. </strong>

              Por favor, corrige los datos antes de continuar.
            </div>

            <!--
                        Campo oculto para conservar el ID.

                        Al registrar:
                        id = null

                        Al editar:
                        id = 1, 2, 3...
                    -->
            <input type="hidden" th:field="*{id}" />

            <!-- ====================== -->
            <!-- NOMBRE DEL ÁREA -->
            <!-- ====================== -->

            <div class="mb-3">
              <label for="nombre" class="form-label"> Nombre </label>

              <!--
                            th:field conecta este input
                            con el atributo nombre
                            de la entidad Area.
                        -->
              <input
                type="text"
                id="nombre"
                class="form-control"
                th:field="*{nombre}"
                placeholder="Ejemplo: Almacén"
              />

              <!--
                            Mensaje específico del nombre.

                            Puede aparecer cuando:

                            - está vacío;
                            - solo contiene espacios;
                            - supera los 100 caracteres.
                        -->
              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('nombre')}"
                th:errors="*{nombre}"
              ></div>
            </div>

            <!-- ====================== -->
            <!-- DESCRIPCIÓN -->
            <!-- ====================== -->

            <div class="mb-4">
              <label for="descripcion" class="form-label"> Descripción </label>

              <!--
                            Este campo está relacionado
                            con el atributo descripcion
                            de la entidad Area.
                        -->
              <textarea
                id="descripcion"
                class="form-control"
                rows="4"
                th:field="*{descripcion}"
                placeholder="Describe brevemente el área"
              >
              </textarea>

              <!--
                            Mensaje específico de descripción.

                            Actualmente aparece si el texto
                            supera los 255 caracteres.
                        -->
              <div
                class="text-danger mt-1"
                th:if="${#fields.hasErrors('descripcion')}"
                th:errors="*{descripcion}"
              ></div>
            </div>

            <!-- ====================== -->
            <!-- BOTONES -->
            <!-- ====================== -->

            <div class="d-flex gap-2">
              <!--
                            Envía el formulario mediante POST
                            hacia /areas/guardar.
                        -->
              <button type="submit" class="btn btn-primary">Guardar</button>

              <!--
                            Regresa al listado de áreas
                            sin guardar cambios.
                        -->
              <a th:href="@{/areas}" class="btn btn-outline-secondary">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
