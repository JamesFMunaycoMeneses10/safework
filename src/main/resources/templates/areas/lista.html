<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Áreas - SafeWork</title>

    <!--
        Bootstrap.

        Esta hoja de estilos nos permite utilizar
        clases ya preparadas para botones, tablas,
        espacios, tamaños, colores, etc.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <!--
        container:
        centra el contenido y establece márgenes laterales.

        py-5:
        agrega espacio vertical arriba y sabajo.
    -->
    <div class="container py-5">
      <!-- Encabezado de la página -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="mb-1">Gestión de Áreas</h1>

          <p class="text-secondary mb-0">
            Administra las áreas de trabajo de SafeWork.
          </p>
        </div>

        <!-- Botón para registrar una nueva área -->
        <a th:href="@{/areas/nueva}" class="btn btn-primary"> + Nueva Área </a>
      </div>

      <!--
            Card:
            crea un contenedor visual similar
            a una tarjeta.
        -->
      <div class="card shadow-sm">
        <div class="card-body">
          <!-- Permite que la tabla sea adaptable -->
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <!-- Encabezado de la tabla -->
              <thead class="table-light">
                <tr>
                  <th>ID</th>

                  <th>Nombre</th>

                  <th>Descripción</th>

                  <th class="text-end">Acciones</th>
                </tr>
              </thead>

              <tbody>
                <!--
                                Recorremos las áreas enviadas
                                desde AreaController.
                            -->
                <tr th:each="area : ${areas}">
                  <!-- ID -->
                  <td th:text="${area.id}"></td>

                  <!-- Nombre -->
                  <td th:text="${area.nombre}"></td>

                  <!-- Descripción -->
                  <td th:text="${area.descripcion}"></td>

                  <!-- Acciones -->
                  <td class="text-end">
                    <!-- Editar -->
                    <a
                      th:href="@{/areas/editar/{id}(id=${area.id})}"
                      class="btn btn-sm btn-outline-primary"
                    >
                      Editar
                    </a>

                    <!--
                                        Eliminar.

                                        Utilizamos POST porque
                                        estamos modificando datos.
                                    -->
                    <form
                      th:action="@{/areas/eliminar/{id}(id=${area.id})}"
                      method="post"
                      class="d-inline"
                      onsubmit="
                        return confirm('¿Está seguro de eliminar esta área?');
                      "
                    >
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                      >
                        Eliminar
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
