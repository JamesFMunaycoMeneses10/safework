# Production-like configuration: credentials are never bundled in the image.
spring.datasource.url=${SAFEWORK_DB_URL}
spring.datasource.username=${SAFEWORK_DB_USER}
spring.datasource.password=${SAFEWORK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SAFEWORK_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Schema is migrated before validation; no automatic destructive schema operations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Retain the application's current lazy-loading behavior until services are refactored.
spring.jpa.open-in-view=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

server.port=${PORT:8080}
server.shutdown=graceful
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Enable only when HTTPS is actually configured; the local pilot uses HTTP on loopback.
server.servlet.session.cookie.secure=${SAFEWORK_HTTPS:false}
server.error.include-message=never
server.error.include-stacktrace=never

# Detailed metrics/health are not made public by this profile.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
